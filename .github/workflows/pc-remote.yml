name: PC Remote Companion

on:
  push:
    branches: [main]
    paths: ['Companion/**', '.github/workflows/pc-remote.yml']
  pull_request:
    paths: ['Companion/**', '.github/workflows/pc-remote.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r Companion/requirements.txt
      - name: Test authentication, shutdown cancellation and Wake-on-LAN
        working-directory: Companion
        run: python -m unittest discover -s tests -v
      - name: Check installer Windows PowerShell 5.1 syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem Companion/*.ps1 | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: Package Windows executable
        if: runner.os == 'Windows'
        run: |
          python -m pip install -r Companion/requirements-build.txt
          python -m PyInstaller --clean --noconfirm --onedir --name iDomRemote --distpath package Companion/idom_remote.py
      - name: Check packaged executable and collect installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./package/iDomRemote/iDomRemote.exe --config "$env:RUNNER_TEMP/pc-check.json" --init pc
          if ($LASTEXITCODE -ne 0) { throw 'Init failed' }
          ./package/iDomRemote/iDomRemote.exe --config "$env:RUNNER_TEMP/pc-check.json" --check
          if ($LASTEXITCODE -ne 0) { throw 'Config check failed' }
          $fixture = Get-Content "$env:RUNNER_TEMP/pc-check.json" -Raw | ConvertFrom-Json
          $process = Start-Process ./package/iDomRemote/iDomRemote.exe -ArgumentList ('--config "{0}/pc-check.json" --dry-run' -f $env:RUNNER_TEMP) -PassThru
          try {
            $response = $null
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $response = Invoke-RestMethod http://127.0.0.1:47321/v1/status -Headers @{ Authorization = 'Bearer ' + $fixture.token } -TimeoutSec 2
                break
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $response.simulated -or $response.role -ne 'pc') { throw 'Packaged HTTP server did not start in simulation mode' }
          } finally { Stop-Process -Id $process.Id -ErrorAction SilentlyContinue }
          Copy-Item Companion/*.ps1 package/iDomRemote/
          Copy-Item Companion/README.md package/iDomRemote/
          Get-ChildItem package/iDomRemote -File -Recurse | Get-FileHash -Algorithm SHA256 | Format-List | Out-File package/iDomRemote/SHA256.txt
      - name: Downloadable Windows component
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: iDom-Remote-Windows-x64
          path: package/iDomRemote/
          retention-days: 30
