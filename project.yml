name: iDom
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
options:
  settingPresets: none
  bundleIdPrefix: it.domenicolella
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  objectVersion: 60
  minimumXcodeGenVersion: "2.0.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      DEBUG_INFORMATION_FORMAT: dwarf
targets:
  iDom:
    type: application
    platform: iOS
    sources:
      - path: iDom
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        MACH_O_TYPE: mh_execute
        PRODUCT_BUNDLE_IDENTIFIER: it.domenicolella.iDom
        MARKETING_VERSION: 0.3.0
        CURRENT_PROJECT_VERSION: 4
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: iDom
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "iDom usa la tua posizione solo quando scegli di salvare dove hai parcheggiato."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: 1
    scheme:
      testTargets:
        - iDomUITests
  iDomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: iDom
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: it.domenicolella.iDomUITests
        MACH_O_TYPE: mh_bundle
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: iDom
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"
