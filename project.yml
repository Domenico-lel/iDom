name: iDom
options:
  bundleIdPrefix: it.domenicolella
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  iDom:
    type: application
    platform: iOS
    sources:
      - path: iDom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.domenicolella.iDom
        MARKETING_VERSION: 0.2.1
        CURRENT_PROJECT_VERSION: 3
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: iDom
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "iDom usa la tua posizione solo quando scegli di salvare dove hai parcheggiato."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: 1
    scheme:
      testTargets: []
